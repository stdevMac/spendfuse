[package]
name = "tripwire"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"
description = "On-chain spending firewall for AI agents on NEAR: policy limits, human approval, shared blocklist and canary payees."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(near)'] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
